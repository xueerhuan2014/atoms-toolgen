# Render 部署配置 —— 小工具生成器
# 文档: https://render.com/docs/yaml-spec

services:
  - type: web
    name: atoms-toolgen
    env: python
    # Render 平台会自动注入 PORT 环境变量，main.py 已从 PORT 读取
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port ${PORT}"
    healthCheckPath: "/api/health"
    region: singapore  # 可改为 frankfurt / oregon 等
    # 环境变量在 Render 控制台 Environment 里单独填（不要写在这里）
